<style>
*{box-sizing:border-box;margin:0}
:root{--ac:#4f46e5;--ac2:#7c3aed;--acd:#4338ca;--ink:#0f172a;--mut:#64748b;--line:#e6e9f5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--bg:#e9e7f7;--fld:#f7f8fc}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sarabun','Noto Sans Thai','Loma',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}
body.noscroll{overflow:hidden}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:#f3f1fb;position:relative;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
@media(min-width:560px){.wrap{margin:24px auto;min-height:0;border-radius:30px;overflow:hidden;box-shadow:0 22px 60px rgba(67,56,202,.22)}}
/* hero */
.hero{background:linear-gradient(150deg,#4338ca,#6366f1 55%,#8b5cf6);color:#fff;padding:18px 18px 74px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.1);right:-75px;top:-65px}
.hero:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);left:-45px;bottom:-70px}
.hero>*{position:relative;z-index:1}
.hero.ok{background:linear-gradient(150deg,#15803d,#22c55e)}.hero.bad{background:linear-gradient(150deg,#b91c1c,#ef4444)}.hero.wait{background:linear-gradient(150deg,#b45309,#f59e0b)}.hero.gray{background:linear-gradient(150deg,#475569,#94a3b8)}
.hr{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
.hr .lg{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:16px}
.hr .sp{flex:1}
.lang{display:flex;gap:3px;background:rgba(255,255,255,.2);border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;color:#e0e7ff;font:inherit;font-size:13px;font-weight:700;padding:4px 12px;border-radius:99px;cursor:pointer}
.lang button.on{background:#fff;color:var(--acd)}
.rfb{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:15px;display:grid;place-items:center;cursor:pointer}
.rfb:active{background:rgba(255,255,255,.35)}.rfb:disabled{opacity:.8;cursor:default}.rfb.spin i{animation:sp .8s linear infinite}
.hero h1{font-size:28px;margin:18px 0 4px;line-height:1.2;font-weight:700}
.hero p{font-size:14px;opacity:.92}
.hero.center{text-align:center}.hero.center h1{margin-top:8px}
.hero .ck{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;margin:14px auto 8px;font-size:34px}
.body{margin-top:-50px;padding:0 14px;position:relative;z-index:2}
/* cards */
.card{background:#fff;border-radius:22px;padding:15px 15px 12px;margin-bottom:12px;box-shadow:0 10px 26px rgba(67,56,202,.1)}
.ct{display:flex;gap:9px;align-items:center;font-weight:700;font-size:15px;margin-bottom:11px}
.ct i{width:30px;height:30px;border-radius:10px;background:#eef0ff;color:var(--ac);display:grid;place-items:center;font-size:15px}
.ct small{margin-left:auto;font-weight:400;color:var(--mut);font-size:12px}
.f{margin-bottom:11px}
.f>label{display:block;font-size:13px;color:#334155;font-weight:700;margin-bottom:5px}
.f>label b{color:var(--bad)}
.in{width:100%;height:46px;border:1.5px solid var(--line);border-radius:13px;padding:0 13px;font:inherit;font-size:16px;color:var(--ink);background:var(--fld);outline:none;transition:.15s}
textarea.in{height:76px;padding:10px 13px;resize:vertical}
.in:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 4px rgba(79,70,229,.13)}
.in.err{border-color:var(--bad);box-shadow:0 0 0 4px rgba(220,38,38,.1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip.tile{border:1.5px solid var(--line);border-radius:16px;text-align:center;padding:10px 2px 8px;font:inherit;font-size:12px;font-weight:700;color:var(--mut);background:var(--fld);cursor:pointer;line-height:1.25}
.chip.tile i{display:block;font-size:21px;color:var(--ac);margin-bottom:4px}
.chip.tile.on{background:linear-gradient(150deg,#4f46e5,#7c3aed);border-color:transparent;color:#fff;box-shadow:0 8px 16px rgba(79,70,229,.3)}
.chip.tile.on i{color:#fff}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}
/* availability */
.lanes{position:relative}
.lane{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:#475569}
.lane .n{width:92px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:18px;border-radius:6px;background:#e7f6ec;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#c1c8dc 0 5px,#d6dbea 5px 10px)}
.band{position:absolute;top:-3px;bottom:-3px;left:100px;right:0;pointer-events:none}
.band b{position:absolute;top:0;bottom:0;background:rgba(79,70,229,.14);border:2px solid #4f46e5;border-radius:8px}
.ax{position:relative;height:14px;margin-left:100px;font-size:10px;color:#94a3b8}
.ax span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;text-decoration:none}
.pill{margin-left:auto;border-radius:99px;font-size:12px;font-weight:700;padding:2px 11px}
.pill.g{background:#dcfce7;color:#166534}.pill.w{background:#fef3c7;color:#92400e}
.msg{border-radius:12px;padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start;margin:4px 0 10px}
.msg.w{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.msg.e{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
/* buttons */
.btn{width:100%;height:50px;border:0;border-radius:15px;background:linear-gradient(150deg,#4f46e5,#7c3aed);color:#fff;font:inherit;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 20px rgba(79,70,229,.32);cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{height:44px;font-size:14px;border-radius:13px;box-shadow:none}
.btn.ghost{background:#eceefe;color:var(--acd);box-shadow:none}
.btn.line{background:#fff;color:var(--acd);border:1.5px solid #c7c2fb;box-shadow:none}
.btn.dng{background:#fff;color:var(--bad);border:1.5px solid #fecaca;box-shadow:none}
.btn.red{background:linear-gradient(150deg,#dc2626,#ef4444);box-shadow:0 10px 20px rgba(220,38,38,.28)}
.row2{display:flex;gap:9px}.row2>*{flex:1}
.note{font-size:12px;color:var(--mut);text-align:center;margin:8px 0 4px;line-height:1.6}
.link{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.sbar{position:sticky;bottom:0;z-index:5;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:11px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(67,56,202,.13);display:flex;align-items:center;gap:12px;margin-top:6px}
.sbar .t{font-size:12px;color:var(--mut);min-width:0;line-height:1.3}.sbar .t b{display:block;color:var(--ink);font-size:14px}
.sbar .btn{flex:1;min-width:0}
/* mine */
.mi{background:var(--fld);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 13px;display:flex;align-items:center;gap:9px;margin-bottom:8px;cursor:pointer}
.mi b{font-size:14px;color:var(--acd)}.mi small{display:block;font-size:12px;color:var(--mut)}.mi .s{margin-left:auto}
.mx{border:0;background:transparent;color:#94a3b8;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:12px;flex:none}.mx:hover{background:#fee2e2;color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.b-w{background:#fef3c7;color:#92400e}.b-o{background:#dcfce7;color:#166534}.b-x{background:#fee2e2;color:#991b1b}.b-g{background:#e2e8f0;color:#475569}
.foot{text-align:center;font-size:12px;color:#94a3b8;margin:10px 14px 0}
/* status */
.ref{text-align:center;border:2px dashed #c7c2fb;border-radius:16px;padding:10px;background:#f1efff;margin-bottom:12px}
.ref small{display:block;font-size:12px;color:var(--mut)}.ref b{font-size:30px;letter-spacing:2px;color:var(--acd)}
.hst{display:flex;margin:6px 0 14px}
.hst>div{flex:1;text-align:center;font-size:12px;color:var(--mut);font-weight:600;position:relative}
.hst i{width:28px;height:28px;border-radius:50%;background:#e2e8f0;color:#94a3b8;display:grid;place-items:center;margin:0 auto 4px;font-style:normal;font-size:14px;position:relative;z-index:1}
.hst .d i{background:var(--ok);color:#fff}.hst .n i{background:var(--warn);color:#fff;box-shadow:0 0 0 5px rgba(217,119,6,.2)}.hst .x i{background:var(--bad);color:#fff}
.hst .d,.hst .n,.hst .x{color:var(--ink)}
.hst>div:not(:last-child):after{content:'';position:absolute;top:13px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:#e2e8f0}
.hst .d:not(:last-child):after{background:var(--ok)}
.sum>div{display:flex;gap:9px;font-size:14px;padding:8px 0;border-bottom:1px solid #f0f1f8;align-items:flex-start}
.sum>div:last-child{border:0}
.sum i{color:var(--ac);width:18px;flex:none;margin-top:2px}.sum span{color:var(--mut);width:84px;flex:none;font-size:13px}.sum em{font-style:normal;word-break:break-word;min-width:0}
.big{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:14px;line-height:1.8}
.big.bad{background:#fef2f2;border-color:#fecaca}
.big i{color:var(--ok);margin-right:6px}.big.bad i{color:var(--bad)}
.chg{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:14px;line-height:1.7}
.chg b{display:block;color:#92400e;margin-bottom:3px}.chg i{color:var(--warn);margin-right:6px}.chg s{color:#94a3b8}.chg .nw{font-weight:700;color:var(--ink)}

.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:50;padding:18px;opacity:0;transition:opacity .18s}
.ov.on{opacity:1}
.md{background:#fff;border-radius:26px;max-width:400px;width:100%;padding:24px 20px 18px;box-shadow:0 30px 60px rgba(15,23,42,.35);text-align:center;max-height:calc(100vh - 36px);overflow:auto;transform:translateY(14px) scale(.97);transition:transform .2s cubic-bezier(.2,.9,.3,1.2)}
.ov.on .md{transform:none}
.md h3{font-size:20px;margin-bottom:4px}.md p.s{font-size:14px;color:var(--mut);margin-bottom:14px}
.md .left{text-align:left}
.mic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:34px;margin:0 auto 12px}
.mic.ok{background:linear-gradient(150deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 12px 24px rgba(79,70,229,.35);animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
.mic.wn{background:#fef3c7;color:var(--warn)}.mic.rd{background:#fee2e2;color:var(--bad)}.mic.in{background:#eef0ff;color:var(--ac)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.code{background:#f1efff;border:2px dashed #c7c2fb;border-radius:16px;padding:9px;margin:0 0 14px}.code small{display:block;color:var(--mut);font-size:12px}.code b{font-size:28px;letter-spacing:2px;color:var(--acd)}
.md .row2{margin-top:6px}.md .btn{height:46px;font-size:15px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>

async function api(action, payload) {

    let m = String(data.message || '').replace(/^บันทึกไม่สำเร็จ \(Lock\/Error\):\s*/, '');
    // ข้อความจากฝั่ง Google Script เป็นภาษาไทย — แปลงเป็นภาษาที่เลือกอยู่ (คงข้อความเดิมไว้ถ้าไม่รู้จัก)
    const map = [[/Invalid action/i, 'eNotReady'], [/ไม่พบคำขอ/, 'eNotFound'], [/เบอร์โทรไม่ถูกต้อง/, 'vPhone'], [/จองย้อนหลังไม่ได้/, 'vPast'], [/ส่งคำขอวันนี้ครบ/, 'eQuota'], [/ระบบมีคำขอค้างอยู่มาก/, 'eQueue'], [/ทีมขนส่งพิจารณาแล้ว/, 'eDecided'], [/เวลากลับต้องหลังเวลาไป/, 'vOrder']];
    for (let i = 0; i < map.length; i++) if (map[i][0].test(m) || map[i][0].test(String(data.message || ''))) throw mkErr(map[i][1]);

}

async function syncMine(manual) {
  const b = document.getElementById('frf');
  if (manual) { if (!b || b.disabled) return; b.disabled = true; b.classList.add('spin'); try { Object.assign(form, readForm()); } catch (e) { } }
  const list = getMine(); let changed = 0, bad = 0, gone = [];
  await Promise.all(list.map(async (m) => {
    if (!m.token) return;   // ไม่มีลิงก์ส่วนตัว = เช็คเองไม่ได้ (ต้องมีเบอร์)
    try {
      const x = await api('checkVehicleRequest', { token: m.token });
      const q = x && x.request; if (!q) return;
      if (q.status !== m.status || q.date !== m.date || q.startTime !== m.startTime) changed++;
      m.status = q.status; m.date = q.date; m.startTime = q.startTime;
    } catch (e) { if (e && e.key === 'eNotFound') gone.push(m.code); else bad++; }
  }));
  if (view !== 'form' || editCtx) { if (manual && b) { b.disabled = false; b.classList.remove('spin'); } return; }
  const keep = list.filter((m) => gone.indexOf(m.code) < 0);
  // รวมกับรายการที่เพิ่งเพิ่มระหว่างรอ (กันทับ)
  const now = getMine(); const merged = now.filter((m) => gone.indexOf(m.code) < 0).map((m) => keep.find((k) => k.code === m.code) || m);
  if (list.length) setMine(merged);
  if (manual) { resetAv(); try { Object.assign(form, readForm()); } catch (e) { } }
  if (manual || gone.length || changed) { renderForm(); }
  if (manual) toast(list.length && bad === list.length && !gone.length ? t('tFail') : gone.length ? t('tRemoved', { n: gone.length }) : changed ? t('tChanged', { n: changed }) : t('tUpdated'));
  else if (gone.length) toast(t('tRemoved', { n: gone.length }));
}

async function loadAvailability(date) {
  if (avCache.date === date && (avCache.data || avCache.loading)) return;
  avCache = { date, data: null, loading: true, err: '' }; drawAvailability();
  try {
    const d = await api('getVehicleBookingPublic', { date });
    if (avCache.date !== date) return;
    avCache = { date, data: d, loading: false, err: '' };
  } catch (e) { if (avCache.date !== date) return; avCache = { date, data: null, loading: false, err: e.message }; }
  drawAvailability();
}
function freeVehicles() {
  const a = avCache; if (!a.data || !form.startTime || !form.endTime || toMin(form.endTime) <= toMin(form.startTime)) return null;
  const s = toMin(form.startTime), e = toMin(form.endTime);

function validate(o) {
  const bad = (name, key) => ({ name, msg: t(key) });
  if (!o.requesterName) return bad('requesterName', 'vName');
  if (!o.dept) return bad('dept', 'vDept');
  if (o.phone.replace(/\D/g, '').length < 9) return bad('phone', 'vPhone');
  if (!o.destination) return bad('destination', 'vDest');
  if (o.destPhone && (o.destPhone.replace(/\D/g, '').length < 5 || o.destPhone.replace(/\D/g, '').length > 20)) return bad('destPhone', 'vDPhone');
  if (!o.date) return bad('date', 'vDate');
  if (o.date < todayStr()) return bad('date', 'vPast');
  if (!o.startTime) return bad('startTime', 'vFrom');
  if (!o.endTime) return bad('endTime', 'vTo');
  if (toMin(o.endTime) <= toMin(o.startTime)) return bad('endTime', 'vOrder');
  return null;
}

    '<div class="hero center ' + H[0] + '">' + brandRow() + '<div class="ck"><i class="bi bi-' + H[1] + '"></i></div><h1>' + esc(t(H[2])) + '</h1><p>' + esc(t(H[3])) + '</p></div>' +
    '<div class="body"><div class="card"><div class="ref"><small>' + esc(t('ref')) + '</small><b>' + esc(r.code) + '</b></div>' + steps + chg + detail +
    '<div class="sum"><div><i class="bi bi-person"></i><span>' + esc(t('whoL')) + '</span><em>' + esc(r.requesterName) + ' · ' + esc(r.dept) + '</em></div>' +
    '<div><i class="bi bi-geo-alt"></i><span>' + esc(t('toL')) + '</span><em>' + esc(r.destination) + '</em></div>' +
    (r.destPhone || r.destContact ? '<div><i class="bi bi-telephone-outbound"></i><span>' + esc(t('dpL')) + '</span><em>' + (r.destPhone ? '<a class="tl" href="tel:' + esc(String(r.destPhone).replace(/[^0-9+]/g, '')) + '">' + esc(r.destPhone) + '</a>' : '') + (r.destContact ? (r.destPhone ? ' · ' : '') + esc(r.destContact) : '') + '</em></div>' : '') +
    '<div><i class="bi bi-calendar-event"></i><span>' + esc(t('whenL')) + '</span><em>' + esc(fmtDate(r.date)) + '<br>' + esc(r.startTime) + ' – ' + esc(r.endTime) + esc(t('tsfx')) + '</em></div>' +
    '<div><i class="bi bi-flag"></i><span>' + esc(t('purL')) + '</span><em>' + esc(purposeLabel(r.purpose)) + (r.detail ? ' · ' + esc(r.detail) : '') + '</em></div></div></div>' +
    '<div class="card" style="padding-bottom:15px">' + acts + '</div>' +
    '<div class="row2" style="margin:0 0 4px">' + (link ? '<button class="btn sm ghost" id="cp"><i class="bi bi-link-45deg"></i>' + esc(t('copyLink')) + '</button>' : '') + '<button class="btn sm ghost" id="rf"><i class="bi bi-arrow-clockwise"></i>' + esc(t('refresh')) + '</button></div>' +
    (link ? '<div class="note">' + esc(t('linkNote')) + '</div>' : '') +
    '<div style="text-align:center;margin-top:2px"><button class="link" id="home">' + esc(t('home')) + '</button></div><div class="foot">' + esc(t('foot')) + '</div></div>';
  bindLang();
  const $ = (id) => document.getElementById(id);
  if ($('home')) $('home').onclick = () => { stopRefresh(); cur = null; history.replaceState(null, '', location.pathname + location.search); form = newForm(); renderForm(); };
  if ($('rf')) $('rf').onclick = async () => { try { const x = await api('checkVehicleRequest', curToken ? { token: curToken } : { code: cur.code, phone: cur.phone }); cur = x.request; renderStatus(); toast(t('tRefreshed')); } catch (e) { if (e.key === 'eNotFound') gone(); else toast(e.message); } };
  if ($('cp')) $('cp').onclick = () => copyText(link);
  if ($('ed')) $('ed').onclick = () => { editCtx = { token: curToken, code: cur.code }; form = newForm({ requesterName: cur.requesterName, dept: cur.dept, phone: cur.phone, destination: cur.destination, destContact: cur.destContact || '', destPhone: cur.destPhone || '', date: cur.date, startTime: cur.startTime, endTime: cur.endTime, purpose: cur.purpose, detail: cur.detail }); resetAv(); renderForm(); };
  if ($('again')) $('again').onclick = () => { editCtx = null; form = newForm({ destination: cur.destination, destContact: cur.destContact || '', destPhone: cur.destPhone || '', startTime: cur.startTime, endTime: cur.endTime, purpose: cur.purpose, detail: cur.detail, requesterName: cur.requesterName, dept: cur.dept, phone: cur.phone }); resetAv(); history.replaceState(null, '', location.pathname + location.search); renderForm(); };
  if ($('cx')) $('cx').onclick = async () => {
    if (!(await ask({ icon: 'trash3', danger: true, title: t('cxT'), text: t('cxP', { c: cur.code }), ok: t('cancelReq') }))) return;
    try { const x = await api('updateVehicleRequestByRequester', { token: curToken, code: cur.code, phone: cur.phone, op: 'cancel' }); showStatus(x.request, curToken); toast(t('tCancelled')); } catch (e) { toast(e.message); }
  };
}

// ===================== ตรวจสอบด้วยเลขอ้างอิง + เบอร์ (ป็อปอัป) =====================
function openLookup() {
  const mine = getMine().slice(0, 3);
  const list = mine.length ? '<div style="margin:4px 0 12px">' + mine.map((m) => '<div class="mi" data-code="' + esc(m.code) + '" data-r="open:' + esc(m.code) + '"><div style="text-align:left"><b>' + esc(m.code) + '</b><small>' + esc(mineWhen(m)) + '</small></div><span class="s">' + (m.status ? statusBadge(m.status) : '') + '</span></div>').join('') + '</div>' : '';
  modal(icon('in', 'search') + '<h3>' + esc(t('lkT')) + '</h3><p class="s">' + esc(t('lkS')) + '</p>' +
    '<form id="lf" class="left" novalidate><div class="f"><label>' + esc(t('lkCode')) + '</label><input class="in" name="code" placeholder="CAR-1104-03" autocapitalize="characters" autocomplete="off" maxlength="20"></div>' +
    '<div class="f"><label>' + esc(t('lkPhone')) + '</label><input class="in" name="phone" type="tel" inputmode="tel" autocomplete="off" maxlength="20"></div><div id="lm"></div>' + list +
    '<div class="row2"><button type="button" class="btn ghost" data-r="0">' + esc(t('lkClose')) + '</button><button class="btn" type="submit"><i class="bi bi-search"></i>' + esc(t('lkGo')) + '</button></div></form>', (md) => {
    const msg = (h) => { md.querySelector('#lm').innerHTML = h ? '<div class="msg e"><i class="bi bi-exclamation-octagon-fill"></i><div>' + esc(h) + '</div></div>' : ''; };
    md.querySelector('#lf').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target, code = f.elements.code.value.trim().toUpperCase(), phone = f.elements.phone.value.trim();
      if (!code || phone.replace(/\D/g, '').length < 9) { msg(t('lkNeed')); return; }
      try { const r = await api('checkVehicleRequest', { code, phone }); curPhone = phone; closeModal(false); showStatus(r.request, ''); }
      catch (er) { msg(er.message); }
    };
    const first = md.querySelector('input[name=code]'); if (first && !('ontouchstart' in window)) first.focus();
  }, 'dlg').then((r) => { if (typeof r === 'string' && r.indexOf('open:') === 0) { const c = r.slice(5); const it = getMine().find((x) => x.code === c); if (it) openStatus({ token: it.token, code: it.code }); } });
}

// ===================== เริ่มต้น =====================
function openByRef(ref) {
  if (ref) { openStatus(ref); return; }
  const m = /[#&]t=([A-Za-z0-9]{8,40})/.exec(location.hash);
  if (m) { openStatus({ token: m[1] }); return; }
  form = newForm(); renderForm();
  if (getMine().length) syncMine(false);   // เช็คเงียบๆ: เอารายการที่ถูกลบจากชีตออก + อัปเดตสถานะ
}
window.addEventListener('hashchange', () => { if (/[#&]t=/.test(location.hash)) openByRef(null); });
setLang(LANG);
openByRef(null);
})();
</script>
